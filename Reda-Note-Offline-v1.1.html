<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="Reda Note — ملاحظاتك ومهامك الدراسية في مكان واحد، وتعمل دون إنترنت.">
  <title>Reda Note</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
:root {
  color-scheme: light;
  --bg: #f5f6fa;
  --surface: #ffffff;

  --mint: #28a88b;
  --mint-soft: #e6f7f2;
  --orange: #e89a4b;
  --orange-soft: #fff3e5;
  --red: #dc6a73;
  --red-soft: #fff0f1;
  --shadow: 0 14px 40px rgba(40, 43, 72, .06);
  --radius: 20px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151722;
  --surface: #1e2230;
  --surface-2: #272c3b;
  --text: #edf0fa;
  --muted: #9aa2b7;
  --line: #303648;
  --primary: #a59afa;
  --primary-2: #8d80ee;
  --primary-soft: #302b4c;
  --mint: #5cc4a9;
  --mint-soft: #203a36;
  --orange: #f0b36e;
  --orange-soft: #3e3024;
  --red: #ed8790;
  --red-soft: #3c292f;
  --shadow: 0 14px 40px rgba(0, 0, 0, .16);

* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Tahoma, Arial, sans-serif; font-size: 14px; line-height: 1.65; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent); outline-offset: 2px; }
.app-shell { min-height: 100vh; display: flex; }
.sidebar { width: 250px; flex: 0 0 250px; background: var(--surface); border-left: 1px solid var(--line); padding: 25px 17px 18px; display: flex; flex-direction: column; min-height: 100vh; }

.brand small { display: block; color: var(--muted); font-size: 10px; margin-top: 1px; }
.side-label { color: var(--muted); font-size: 10px; padding: 0 12px 9px; font-weight: 700; letter-spacing: .3px; }

.nav-link:hover { background: var(--surface-2); color: var(--text); }

.subject-label { margin-top: 27px; }

.sidebar-bottom { margin-top: auto; }

.today-label { color: var(--muted); font-size: 11px; }
.icon-button, .avatar { border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
.icon-button { font-size: 19px; }
.avatar { border: 0; color: #fff; background: linear-gradient(140deg, #8779eb, #5749c7); font-weight: 800; }

.btn { border: 0; border-radius: 12px; padding: 10px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; font-weight: 700; font-size: 12px; transition: .18s ease; box-shadow: 0 6px 15px color-mix(in srgb, var(--primary) 18%, transparent); }

.welcome-card { border-radius: 24px; padding: 27px 29px; color: white; background: radial-gradient(circle at 8% 10%, rgba(255,255,255,.19), transparent 24%), linear-gradient(120deg, #6356d2, #877be7); position: relative; overflow: hidden; min-height: 190px; }
.welcome-card:after { content: ""; position: absolute; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; left: -36px; bottom: -112px; box-shadow: 0 0 0 22px rgba(255,255,255,.035), 0 0 0 47px rgba(255,255,255,.025); }

.progress-ring:before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }

.progress-info h3 { font-size: 13px; margin: 0 0 4px; }

.stat-card:nth-child(2) .stat-icon { background: var(--orange-soft); color: var(--orange); }

.stat-card strong { display: block; font-size: 19px; line-height: 1.25; }

.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 24px 0 12px; }

.text-link { border: 0; background: none; color: var(--primary); font-size: 11px; font-weight: 700; padding: 5px; }
.content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 19px; padding: 18px; min-width: 0; }
.panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.panel-title h3 { margin: 0; font-size: 13px; }
.panel-title span { color: var(--muted); font-size: 10px; }
.note-mini, .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }

.note-mini-body, .task-body { min-width: 0; flex: 1; }
.note-mini h4, .task-body h4 { margin: 0 0 3px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-mini p { margin: 0; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-symbol { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: 0 0 32px; }

.focus-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 15px 18px; margin-top: 16px; }
.focus-copy { display: flex; align-items: center; gap: 11px; }

.focus-copy small { color: var(--muted); font-size: 10px; }
.timer-display { font-size: 20px; font-weight: 800; direction: ltr; letter-spacing: 1px; margin-left: 5px; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 15px; }

.note-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

.pin { color: var(--orange); font-size: 13px; }
.note-card h3 { font-size: 13px; margin: 0 0 7px; overflow-wrap: anywhere; }
.note-card p { color: var(--muted); font-size: 11px; margin: 0; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.note-reader-modal { width: min(760px, 100%); }
.note-reader-meta { color: var(--muted); font-size: 11px; margin: -8px 0 15px; }
.note-reader-body { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; max-height: 62vh; overflow-y: auto; padding: 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--bg); line-height: 1.95; font-size: 13px; }

.note-card-footer { margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 9px; }
.card-actions { display: flex; gap: 5px; }

.mini-action:hover { color: var(--primary); }

.danger-zone { border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
.about-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.about-row:last-child { border: 0; }

.modal { width: min(530px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 21px; box-shadow: 0 24px 90px rgba(0,0,0,.25); padding: 22px; max-height: 90vh; overflow-y: auto; animation: fade .18s ease; }

  .app-shell { display: block; } .sidebar { display: none; } .main-area { padding: 0 15px calc(96px + env(safe-area-inset-bottom)); }

  .mobile-brand .brand-mark { width: 31px; height: 31px; font-size: 16px; border-radius: 10px; }

  .welcome-card { padding: 22px; min-height: 182px; } .welcome-card h1 { font-size: 23px; }
  .progress-card { padding: 17px; } .progress-ring { width: 80px; height: 80px; flex-basis: 80px; }
  .stats-grid { gap: 8px; margin-bottom: 19px; } .stat-card { padding: 11px 9px; gap: 8px; border-radius: 14px; } .stat-icon { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; } .stat-card strong { font-size: 16px; } .stat-card small { font-size: 9px; }
  .content-grid { grid-template-columns: 1fr; } .panel { padding: 15px; }
  .subject-grid { grid-template-columns: repeat(2, 1fr); gap: 9px; } .subject-card { padding: 13px; }
  .focus-card { padding: 12px; flex-wrap: wrap; } .focus-card .btn { margin-right: auto; }
  .notes-grid { grid-template-columns: 1fr; } .note-card { min-height: 145px; }
  .toolbar { align-items: stretch; } .searchbar { width: 100%; } .filter-chips { width: 100%; }
  .task-summary { padding: 11px; gap: 9px; } .task-summary strong { font-size: 16px; }
  .task-item .task-body { align-items: flex-start; flex-direction: column; gap: 6px; } .task-details { width: 100%; } .task-item-actions { opacity: 1; align-self: flex-end; }
  .subject-hero { align-items: flex-start; flex-wrap: wrap; padding: 15px; } .subject-hero-actions { width: 100%; margin-right: 0; } .subject-hero .subject-emoji { width: 44px; height: 44px; }
  .settings-grid { grid-template-columns: 1fr; }
  .fab { display: grid; place-items: center; position: fixed; z-index: 8; bottom: calc(81px + env(safe-area-inset-bottom)); left: 18px; width: 52px; height: 52px; border: 0; border-radius: 18px; background: var(--primary); color: white; font-size: 28px; box-shadow: 0 10px 25px color-mix(in srgb, var(--primary) 35%, transparent); }
  .mobile-nav { display: flex; position: fixed; z-index: 9; bottom: 0; right: 0; left: 0; padding: 8px 8px calc(7px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); justify-content: space-around; }
  .mobile-nav-link { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; color: var(--muted); }
  .mobile-nav-link span { font-size: 19px; line-height: 1.2; } .mobile-nav-link small { font-size: 9px; }
  .mobile-nav-link.active { color: var(--primary); font-weight: 700; }
  .modal { padding: 18px; border-radius: 18px; } .form-grid { grid-template-columns: 1fr; gap: 0; } .field.full { grid-column: auto; }
  .toast { left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom)); text-align: center; }
}

.field-select { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 11px; padding: 9px 11px; font-size: 11px; min-width: 135px; outline: 0; }
.field-select:focus { border-color: var(--primary); }

  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <a class="brand" href="#home" data-nav="home" aria-label="Reda Note - الرئيسية">
        <span class="brand-mark">R<span>.</span></span>
        <span><strong>Reda Note</strong><small>مساحتك الهادئة للإنجاز</small></span>
      </a>
      <div class="side-label">المساحة الشخصية</div>
      <nav class="side-nav">
        <button class="nav-link active" data-nav="home"><span class="nav-icon">⌂</span> الرئيسية</button>
        <button class="nav-link" data-nav="notes"><span class="nav-icon">▤</span> الملاحظات <span id="notesCount" class="nav-count">0</span></button>
        <button class="nav-link" data-nav="tasks"><span class="nav-icon">✓</span> قائمة المهام <span id="tasksCount" class="nav-count">0</span></button>
        <button class="nav-link" data-nav="subjects"><span class="nav-icon">▦</span> موادي الدراسية</button>
      </nav>
      <div class="side-label subject-label">اختصارات المواد</div>
      <div id="sidebarSubjects" class="subject-shortcuts"></div>
      <div class="sidebar-bottom">
        <div class="offline-pill"><i></i> يعمل محلياً دون إنترنت</div>
        <button class="nav-link" data-nav="settings"><span class="nav-icon">⚙</span> الإعدادات</button>
        <div class="sidebar-foot">صُمّم للدراسة بهدوء، خطوة بخطوة.</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">R<span>.</span></span><strong>Reda Note</strong></div>
        <div class="breadcrumb" id="breadcrumb">مساحتك الشخصية <span>/</span> الرئيسية</div>
        <div class="top-actions">
          <span class="today-label" id="todayLabel"></span>
          <button class="icon-button" id="themeToggle" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">☾</button>
          <button class="avatar" title="مساحتك">R</button>
        </div>
      </header>

      <section id="page-home" class="page active"></section>
      <section id="page-notes" class="page"></section>
      <section id="page-tasks" class="page"></section>
      <section id="page-subjects" class="page"></section>
      <section id="page-subject" class="page"></section>
      <section id="page-settings" class="page"></section>

      <button class="fab" id="quickAdd" aria-label="إضافة سريعة" title="إضافة سريعة">＋</button>
      <nav class="mobile-nav" aria-label="التنقل">
        <button class="mobile-nav-link active" data-nav="home"><span>⌂</span><small>الرئيسية</small></button>
        <button class="mobile-nav-link" data-nav="notes"><span>▤</span><small>ملاحظات</small></button>
        <button class="mobile-nav-link" data-nav="tasks"><span>✓</span><small>المهام</small></button>
        <button class="mobile-nav-link" data-nav="subjects"><span>▦</span><small>المواد</small></button>
        <button class="mobile-nav-link" data-nav="settings"><span>⚙</span><small>إعدادات</small></button>
      </nav>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'reda-note-data-v1';
  const THEME_KEY = 'reda-note-theme';
  const FOCUS_SETTINGS_KEY = 'reda-note-focus-settings-v1';
  const FOCUS_COUNT_KEY = 'reda-note-focus-completed-v1';
  const DEFAULT_FOCUS_SETTINGS = { focusMinutes: 25, breakMinutes: 5, notifyOnFinish: true };
  const SUBJECTS = [
    { id: 'math', name: 'رياضيات', short: 'رياضيات', icon: '∑', color: '#eeeaff' },
    { id: 'physics', name: 'فيزياء', short: 'فيزياء', icon: '⚡', color: '#fff1df' },
    { id: 'science', name: 'علوم طبيعية', short: 'علوم', icon: '🧬', color: '#e5f7f0' },
    { id: 'arabic', name: 'لغة عربية', short: 'عربية', icon: 'أ', color: '#fceaf0' },
    { id: 'english', name: 'إنجليزية', short: 'إنجليزية', icon: 'EN', color: '#e8f2ff' },
    { id: 'french', name: 'فرنسية', short: 'فرنسية', icon: 'FR', color: '#e9edff' },
    { id: 'history', name: 'تاريخ', short: 'تاريخ', icon: '⌛', color: '#fff0e5' },
    { id: 'geography', name: 'جغرافيا', short: 'جغرافيا', icon: '🌍', color: '#e5f6ed' },
    { id: 'philosophy', name: 'فلسفة', short: 'فلسفة', icon: '💭', color: '#f0eaff' },
    { id: 'islamic', name: 'علوم إسلامية', short: 'إسلامية', icon: '☾', color: '#e7f4f0' }
  ];
  const NOTE_CATEGORIES = ['درس', 'ملخص', 'فكرة', 'مراجعة', 'أخرى'];
  const PRIORITIES = { high: 'مهمة', medium: 'عادية', low: 'منخفضة' };
  const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const uid = () => (crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const safeDate = value => {
    if (!value) return null;
    const [y, m, d] = value.split('-').map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d);
  };
  const formatDate = value => {
    if (!value) return 'بلا تاريخ';
    const date = safeDate(value);
    return date ? new Intl.DateTimeFormat('ar-DZ', { day: 'numeric', month: 'short' }).format(date) : 'تاريخ غير صالح';
  };
  const formatLongDate = date => new Intl.DateTimeFormat('ar-DZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(date);
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const subjectFor = id => SUBJECTS.find(subject => subject.id === id);
  const subjectName = id => subjectFor(id)?.name || 'عام';
  const dateSort = value => value || '9999-12-31';

  function freshState() {
    return { version: 1, notes: [], tasks: [], createdAt: new Date().toISOString() };
  }
  function loadState() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (parsed && Array.isArray(parsed.notes) && Array.isArray(parsed.tasks)) {
        return {
          version: 1,
          notes: parsed.notes.filter(item => item && typeof item === 'object'),
          tasks: parsed.tasks.filter(item => item && typeof item === 'object'),
          createdAt: parsed.createdAt || new Date().toISOString()
        };
      }
    } catch (error) { console.warn('تعذر تحميل البيانات المحلية', error); }
    return freshState();
  }
  let state = loadState();
  let currentPage = 'home';
  let currentSubject = null;
  let notesQuery = '';
  let notesSubjectFilter = 'all';
  let notesCategoryFilter = 'all';
  let taskFilter = 'all';
  let taskSubjectFilter = 'all';
  let toastTimer = null;
  function loadFocusSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(FOCUS_SETTINGS_KEY) || 'null');
      return {
        focusMinutes: Math.min(120, Math.max(1, Number(saved?.focusMinutes) || DEFAULT_FOCUS_SETTINGS.focusMinutes)),
        breakMinutes: Math.min(30, Math.max(1, Number(saved?.breakMinutes) || DEFAULT_FOCUS_SETTINGS.breakMinutes)),
        notifyOnFinish: saved?.notifyOnFinish !== false
      };
    } catch (_) { return { ...DEFAULT_FOCUS_SETTINGS }; }
  }
  let focusSettings = loadFocusSettings();
  let focusInterval = null;
  let focusSeconds = focusSettings.focusMinutes * 60;
  let focusEndsAt = 0;
  let focusRunning = false;

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateSidebarCounts();
    } catch (error) {
      showToast('مساحة التخزين ممتلئة. صدّر نسخة احتياطية ثم احذف بعض البيانات.');
      console.error(error);
    }
  }
  function showToast(message) {
    const toast = $('#toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }
  window.__redaNativeMessage = message => {
    showToast(String(message || ''));
    if (focusRunning && focusSettings.notifyOnFinish && window.RedaAndroid?.scheduleFocusNotification && window.RedaAndroid?.hasNotificationPermission()) {
      window.RedaAndroid.scheduleFocusNotification(Math.max(1000, focusEndsAt - Date.now()));
    }
  };
  function getFocusCount() {
    try { return Number(localStorage.getItem(FOCUS_COUNT_KEY) || 0); } catch (_) { return 0; }
  }
  function updateSidebarCounts() {
    $('#notesCount').textContent = state.notes.length;
    $('#tasksCount').textContent = state.tasks.filter(task => !task.done).length;
  }
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    $('#themeToggle').textContent = theme === 'dark' ? '☀' : '☾';
    $('#themeToggle').title = theme === 'dark' ? 'تفعيل الوضع النهاري' : 'تفعيل الوضع الليلي';
  }
  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const preferred = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    applyTheme(saved || preferred);
  }

  function renderSidebarSubjects() {
    $('#sidebarSubjects').innerHTML = SUBJECTS.map(subject => `
      <button class="nav-link subject-link" data-open-subject="${subject.id}">
        <span class="subject-dot" style="--dot:${subject.color}"></span>${subject.name}
      </button>`).join('');
  }
  function setPage(page, subjectId = null) {
    currentPage = page;
    if (page === 'subject') currentSubject = subjectFor(subjectId) ? subjectId : 'math';
    $$('.page').forEach(section => section.classList.toggle('active', section.id === `page-${page}`));
    $$('.nav-link[data-nav], .mobile-nav-link[data-nav]').forEach(button => button.classList.toggle('active', button.dataset.nav === page || (page === 'subject' && button.dataset.nav === 'subjects')));
    const labels = { home: 'الرئيسية', notes: 'الملاحظات', tasks: 'قائمة المهام', subjects: 'موادي الدراسية', settings: 'الإعدادات', subject: subjectName(currentSubject) };
    $('#breadcrumb').innerHTML = `مساحتك الشخصية <span>/</span> ${escapeHTML(labels[page] || 'الرئيسية')}`;
    renderCurrentPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function renderCurrentPage() {
    if (currentPage === 'home') renderHome();
    if (currentPage === 'notes') renderNotes();
    if (currentPage === 'tasks') renderTasks();
    if (currentPage === 'subjects') renderSubjects();
    if (currentPage === 'subject') renderSubjectPage();
    if (currentPage === 'settings') renderSettings();
    updateSidebarCounts();
  }
  function pageHeading(eyebrow, title, description, action = '') {
    return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`;
  }
  function emptyState(icon, title, description, action = '') {
    return `<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${description}</p>${action}</div>`;
  }
  function dueInfo(task) {
    if (!task.dueDate) return '<span class="due-badge">بلا موعد</span>';
    const today = todayISO();
    if (task.dueDate < today && !task.done) return `<span class="due-badge late">متأخرة · ${formatDate(task.dueDate)}</span>`;
    if (task.dueDate === today && !task.done) return '<span class="due-badge today">اليوم</span>';
    return `<span class="due-badge">${formatDate(task.dueDate)}</span>`;
  }
  function sortedNotes(notes) {
    return [...notes].sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  }
  function sortedTasks(tasks) {
    return [...tasks].sort((a, b) => Number(!!a.done) - Number(!!b.done) || dateSort(a.dueDate).localeCompare(dateSort(b.dueDate)) || (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1));
  }
  function noteMini(note) {
    return `<div class="note-mini"><div class="note-symbol">▤</div><div class="note-mini-body"><h4>${escapeHTML(note.title || 'ملاحظة بلا عنوان')}</h4><p>${escapeHTML((note.body || '').slice(0, 100))}</p></div><button class="mini-action" data-action="view-note" data-id="${escapeHTML(note.id)}" title="قراءة كاملة">◉</button></div>`;
  }
  function taskRow(task) {
    return `<div class="task-row"><input class="task-check" type="checkbox" data-action="toggle-task" data-id="${escapeHTML(task.id)}" ${task.done ? 'checked' : ''} aria-label="إنجاز المهمة"><div class="task-body"><h4 class="${task.done ? 'done' : ''}">${escapeHTML(task.title)}</h4><div class="task-meta"><span>${escapeHTML(subjectName(task.subject))}</span>${dueInfo(task)}</div></div></div>`;
  }
  function renderHome() {
    const today = todayISO();
    const todayTasks = state.tasks.filter(task => task.dueDate === today);
    const doneToday = todayTasks.filter(task => task.done).length;
    const percent = todayTasks.length ? Math.round(doneToday / todayTasks.length * 100) : 0;
    const pending = state.tasks.filter(task => !task.done);
    const lateCount = pending.filter(task => task.dueDate && task.dueDate < today).length;
    const upcoming = sortedTasks(pending.filter(task => !task.dueDate || task.dueDate >= today)).slice(0, 4);
    const recent = sortedNotes(state.notes).slice(0, 3);
    const subjectCards = SUBJECTS.map(subject => {
      const n = state.notes.filter(note => note.subject === subject.id).length;
      const t = state.tasks.filter(task => task.subject === subject.id && !task.done).length;
      return `<button class="subject-card" data-open-subject="${subject.id}" style="--subject-bg:${subject.color}"><span class="subject-emoji">${subject.icon}</span><strong>${subject.name}</strong><small>${n} ملاحظات · ${t} مهام</small></button>`;
    }).join('');
    $('#page-home').innerHTML = `
      <div class="home-hero">
        <div class="welcome-card"><div class="eyebrow">أهلاً بك في مساحتك</div><h1>خطوة صغيرة اليوم،<br>تقدّم كبير غداً.</h1><p>رتّب أفكارك، تابع مهامك، وركّز على ما يستحق وقتك.</p><button class="btn" data-nav="tasks">ابدأ بمهامك <span>←</span></button></div>
        <div class="progress-card"><div class="progress-ring" style="--progress:${percent}"><strong>${percent}%</strong></div><div class="progress-info"><h3>إنجاز مهام اليوم</h3><p>${doneToday} من ${todayTasks.length} مهام مستحقة اليوم</p><div class="small-stat">${todayTasks.length ? (percent === 100 ? 'أحسنت! أكملت مهام اليوم 🎉' : 'استمر على نفس الوتيرة') : 'أضف مهمة بتاريخ اليوم للمتابعة'}</div></div></div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">▤</div><div><strong>${state.notes.length}</strong><small>ملاحظة محفوظة</small></div></div>
        <div class="stat-card"><div class="stat-icon">◷</div><div><strong>${pending.length}</strong><small>مهمة غير منجزة</small></div></div>
        <div class="stat-card"><div class="stat-icon">!</div><div><strong>${lateCount}</strong><small>مهمة متأخرة</small></div></div>
      </div>
      <div class="section-head"><h2>موادك الدراسية</h2><button class="text-link" data-nav="subjects">عرض الكل ←</button></div>
      <div class="subject-grid">${subjectCards}</div>
      <div class="section-head"><h2>لمحة سريعة</h2><span class="muted-copy">لا تحتاج إلى إنجاز كل شيء دفعة واحدة</span></div>
      <div class="content-grid">
        <div class="panel"><div class="panel-title"><h3>المهام القادمة</h3><button class="text-link" data-nav="tasks">كل المهام ←</button></div>${upcoming.length ? upcoming.map(taskRow).join('') : emptyState('✓', 'لا توجد مهام قادمة', 'أضف مهمة صغيرة لتبدأ.')}</div>
        <div class="panel"><div class="panel-title"><h3>آخر الملاحظات</h3><button class="text-link" data-nav="notes">كل الملاحظات ←</button></div>${recent.length ? recent.map(noteMini).join('') : emptyState('▤', 'مساحتك جاهزة', 'أضف أول ملاحظة تحتفظ بها.')}</div>
      </div>
      <div class="focus-card"><div class="focus-copy"><div class="focus-icon">◴</div><div><strong>جلسة تركيز هادئة</strong><small id="focusSubtitle">${focusSettings.focusMinutes} دقيقة تركيز · ${focusSettings.breakMinutes} دقائق استراحة</small><small id="focusCount">جلسات مكتملة: ${getFocusCount()}</small></div></div><div class="timer-display" id="focusTimer">${timerText()}</div><div class="focus-actions"><button class="btn secondary small" id="focusToggle">${focusRunning ? 'إيقاف مؤقت' : (focusSeconds < focusSettings.focusMinutes * 60 && focusSeconds > 0 ? 'استئناف' : 'ابدأ التركيز')}</button><button class="btn ghost small" id="focusReset">إعادة</button><button class="btn ghost small" id="focusSettingsOpen" title="تخصيص الجلسة">⚙</button></div></div>`;
  }

  function renderNotes() {
    let notes = sortedNotes(state.notes);
    if (notesSubjectFilter !== 'all') notes = notes.filter(note => note.subject === notesSubjectFilter);
    if (notesCategoryFilter !== 'all') notes = notes.filter(note => note.category === notesCategoryFilter);
    if (notesQuery.trim()) {
      const query = notesQuery.trim().toLocaleLowerCase('ar');
      notes = notes.filter(note => `${note.title} ${note.body} ${subjectName(note.subject)} ${note.category}`.toLocaleLowerCase('ar').includes(query));
    }
    const subjectOptions = `<option value="all">كل المواد</option>${SUBJECTS.map(subject => `<option value="${subject.id}" ${notesSubjectFilter === subject.id ? 'selected' : ''}>${subject.name}</option>`).join('')}`;
    const categoryOptions = `<option value="all">كل التصنيفات</option>${NOTE_CATEGORIES.map(category => `<option value="${category}" ${notesCategoryFilter === category ? 'selected' : ''}>${category}</option>`).join('')}`;
    const cards = notes.map(note => `<article class="note-card"><div class="note-card-top"><span class="note-tag">${escapeHTML(note.category || 'أخرى')} · ${escapeHTML(subjectName(note.subject))}</span>${note.pinned ? '<span class="pin" title="مثبتة">◆</span>' : ''}</div><h3>${escapeHTML(note.title || 'ملاحظة بلا عنوان')}</h3><p>${escapeHTML(note.body || '')}</p><div class="note-card-footer"><span>${formatDate((note.updatedAt || '').slice(0, 10))}</span><span class="card-actions"><button class="mini-action" data-action="view-note" data-id="${escapeHTML(note.id)}" title="قراءة كاملة">◉</button><button class="mini-action" data-action="pin-note" data-id="${escapeHTML(note.id)}" title="${note.pinned ? 'إلغاء التثبيت' : 'تثبيت'}">${note.pinned ? '◆' : '◇'}</button><button class="mini-action" data-action="edit-note" data-id="${escapeHTML(note.id)}" title="تعديل">✎</button><button class="mini-action" data-action="delete-note" data-id="${escapeHTML(note.id)}" title="حذف">×</button></span></div></article>`).join('');

    if (!task) return;
    task.done = !task.done;
    task.doneAt = task.done ? new Date().toISOString() : null;
    task.updatedAt = new Date().toISOString();
    persist(); renderCurrentPage();
    showToast(task.done ? 'أحسنت! مهمة أخرى أُنجزت ✓' : 'أُعيدت المهمة إلى القائمة');
  }
  function deleteNote(id) {
    if (!confirm('هل تريد حذف هذه الملاحظة نهائياً؟')) return;
    state.notes = state.notes.filter(note => note.id !== id);
    persist(); renderCurrentPage(); showToast('تم حذف الملاحظة');
  }
  function deleteTask(id) {
    if (!confirm('هل تريد حذف هذه المهمة نهائياً؟')) return;
    state.tasks = state.tasks.filter(task => task.id !== id);
    persist(); renderCurrentPage(); showToast('تم حذف المهمة');
  }
  function togglePin(id) {
    const note = state.notes.find(item => item.id === id);
    if (!note) return;
    note.pinned = !note.pinned; note.updatedAt = new Date().toISOString();
    persist(); renderCurrentPage(); showToast(note.pinned ? 'تم تثبيت الملاحظة' : 'تم إلغاء تثبيت الملاحظة');
  }
  function exportData() {
    const backup = { app: 'Reda Note', version: 2, exportedAt: new Date().toISOString(), notes: state.notes, tasks: state.tasks, focusSettings };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = `reda-note-backup-${todayISO()}.json`; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    showToast('تم تجهيز النسخة الاحتياطية');
  }
  function importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || !Array.isArray(parsed.notes) || !Array.isArray(parsed.tasks)) throw new Error('invalid backup');
        if (!confirm(`سيتم دمج ${parsed.notes.length} ملاحظات و${parsed.tasks.length} مهام مع بياناتك الحالية. هل تريد المتابعة؟`)) return;
        const noteIds = new Set(state.notes.map(note => note.id));
        const taskIds = new Set(state.tasks.map(task => task.id));
        const validNotes = parsed.notes.filter(note => note && typeof note.title === 'string').map(note => ({
          id: note.id && !noteIds.has(note.id) ? String(note.id) : uid(), title: String(note.title).slice(0, 100), body: String(note.body || ''),
          subject: SUBJECTS.some(s => s.id === note.subject) ? note.subject : '', category: NOTE_CATEGORIES.includes(note.category) ? note.category : 'أخرى',
          pinned: !!note.pinned, createdAt: note.createdAt || new Date().toISOString(), updatedAt: note.updatedAt || new Date().toISOString()
        }));
        const validTasks = parsed.tasks.filter(task => task && typeof task.title === 'string').map(task => ({
          id: task.id && !taskIds.has(task.id) ? String(task.id) : uid(), title: String(task.title).slice(0, 120), description: String(task.description || '').slice(0, 180),
          subject: SUBJECTS.some(s => s.id === task.subject) ? task.subject : '', dueDate: /^\d{4}-\d{2}-\d{2}$/.test(task.dueDate || '') ? task.dueDate : '',
          priority: ['high', 'medium', 'low'].includes(task.priority) ? task.priority : 'medium', done: !!task.done, doneAt: task.doneAt || null,
          createdAt: task.createdAt || new Date().toISOString(), updatedAt: task.updatedAt || new Date().toISOString()
        }));
        state.notes.push(...validNotes); state.tasks.push(...validTasks); persist();
        if (parsed.focusSettings && typeof parsed.focusSettings === 'object') {
          focusSettings = { focusMinutes: Math.min(120, Math.max(1, Number(parsed.focusSettings.focusMinutes) || 25)), breakMinutes: Math.min(30, Math.max(1, Number(parsed.focusSettings.breakMinutes) || 5)), notifyOnFinish: parsed.focusSettings.notifyOnFinish !== false };
          try { localStorage.setItem(FOCUS_SETTINGS_KEY, JSON.stringify(focusSettings)); } catch (_) {}
          focusSeconds = focusSettings.focusMinutes * 60;
        }
        renderCurrentPage(); showToast(`تم استيراد ${validNotes.length} ملاحظات و${validTasks.length} مهام`);
      } catch (error) { alert('تعذر قراءة الملف. تأكد أنه نسخة JSON صادرة من Reda Note.'); }
    };
    reader.onerror = () => alert('تعذرت قراءة الملف.');
    reader.readAsText(file);
  }
  function clearAllData() {
    if (!confirm('هل أنت متأكد؟ سيتم حذف جميع الملاحظات والمهام من هذا الجهاز نهائياً.')) return;
    if (!confirm('تأكيد أخير: هل صدّرت نسخة احتياطية إن كنت تحتاج بياناتك؟')) return;
    state = freshState(); persist(); renderCurrentPage(); showToast('تم مسح البيانات المحلية');
  }

  function timerText() {
    const minutes = Math.floor(focusSeconds / 60).toString().padStart(2, '0');
    const seconds = (focusSeconds % 60).toString().padStart(2, '0');
    return `${minutes}:${seconds}`;
  }
  function updateTimerUI() {
    const display = $('#focusTimer');
    const button = $('#focusToggle');
    const subtitle = $('#focusSubtitle');
    const count = $('#focusCount');
    if (display) display.textContent = timerText();
    if (button) button.textContent = focusRunning ? 'إيقاف مؤقت' : (focusSeconds < focusSettings.focusMinutes * 60 && focusSeconds > 0 ? 'استئناف' : 'ابدأ التركيز');
    if (subtitle) subtitle.textContent = `${focusSettings.focusMinutes} دقيقة تركيز · ${focusSettings.breakMinutes} دقائق استراحة`;
    if (count) count.textContent = `جلسات مكتملة: ${getFocusCount()}`;
  }
  function completeFocusSession() {
    if (window.RedaAndroid?.cancelFocusNotification) window.RedaAndroid.cancelFocusNotification();
    clearInterval(focusInterval); focusRunning = false; focusEndsAt = 0; focusSeconds = 0; updateTimerUI();
    try { localStorage.setItem(FOCUS_COUNT_KEY, String(getFocusCount() + 1)); } catch (_) {}
    showToast(`انتهت جلسة التركيز! أحسنت. خذ استراحة ${focusSettings.breakMinutes} دقائق 🌿`);
    if (focusSettings.notifyOnFinish) {
      const title = 'انتهت جلسة التركيز';
      const body = `أحسنت! حان وقت استراحة لمدة ${focusSettings.breakMinutes} دقائق.`;
      if (window.RedaAndroid?.showFocusNotification) window.RedaAndroid.showFocusNotification(title, body);
      else if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
    }
    if (window.RedaAndroid?.vibrate) window.RedaAndroid.vibrate(450);
    else if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  }
  function syncFocusRemaining() {
    if (!focusRunning || !focusEndsAt) return;
    focusSeconds = Math.max(0, Math.ceil((focusEndsAt - Date.now()) / 1000));
    updateTimerUI();
    if (focusSeconds <= 0) completeFocusSession();
  }
  function toggleFocus() {
    if (focusRunning) {
      syncFocusRemaining();
      if (!focusRunning) return;
      if (window.RedaAndroid?.cancelFocusNotification) window.RedaAndroid.cancelFocusNotification();
      clearInterval(focusInterval); focusRunning = false; focusEndsAt = 0; updateTimerUI();
      showToast('تم إيقاف جلسة التركيز مؤقتًا');
      return;
    }
    if (focusSeconds <= 0) focusSeconds = focusSettings.focusMinutes * 60;
    focusRunning = true;
    focusEndsAt = Date.now() + focusSeconds * 1000;
    if (focusSettings.notifyOnFinish && window.RedaAndroid?.scheduleFocusNotification) {
      window.RedaAndroid.scheduleFocusNotification(focusSeconds * 1000);
    }
    focusInterval = setInterval(syncFocusRemaining, 250);
    updateTimerUI();
    showToast('بدأت جلسة التركيز. خطوة واحدة في كل مرة ✨');
  }
  function resetFocus() {
    if (window.RedaAndroid?.cancelFocusNotification) window.RedaAndroid.cancelFocusNotification();
    clearInterval(focusInterval); focusRunning = false; focusEndsAt = 0;
    focusSeconds = focusSettings.focusMinutes * 60; updateTimerUI();
    showToast('أُعيد ضبط المؤقّت');
  }

  document.addEventListener('click', event => {
    const nav = event.target.closest('[data-nav]');
    if (nav) { setPage(nav.dataset.nav); return; }
    const openSubject = event.target.closest('[data-open-subject]');
    if (openSubject) { setPage('subject', openSubject.dataset.openSubject); return; }
    const actionEl = event.target.closest('[data-action]');
    if (actionEl) {
      const { action, id, subject } = actionEl.dataset;
      if (action === 'close-modal') closeModal();
      if (action === 'new-note') openNoteModal(null, subject || null);
      if (action === 'new-task') openTaskModal(null, subject || null);
      if (action === 'edit-note') openNoteModal(state.notes.find(note => note.id === id));
      if (action === 'view-note') openNoteReader(state.notes.find(note => note.id === id));
      if (action === 'edit-task') openTaskModal(state.tasks.find(task => task.id === id));
      if (action === 'delete-note') deleteNote(id);
      if (action === 'delete-task') deleteTask(id);
      if (action === 'pin-note') togglePin(id);
      if (action === 'show-subject-notes') { notesSubjectFilter = subject; notesCategoryFilter = 'all'; notesQuery = ''; setPage('notes'); }
      if (action === 'show-subject-tasks') { taskSubjectFilter = subject; taskFilter = 'all'; setPage('tasks'); }
      return;
    }
    const taskFilterButton = event.target.closest('[data-task-filter]');
    if (taskFilterButton) { taskFilter = taskFilterButton.dataset.taskFilter; renderTasks(); return; }
    const setTheme = event.target.closest('[data-set-theme]');
    if (setTheme) { applyTheme(setTheme.dataset.setTheme); showToast('تم تغيير المظهر'); return; }
    if (event.target.closest('#quickAdd')) { openQuickAdd(); return; }
    if (event.target.closest('#themeToggle')) { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); return; }
    if (event.target.closest('#focusToggle')) { toggleFocus(); return; }
    if (event.target.closest('#focusReset')) { resetFocus(); return; }
    if (event.target.closest('#focusSettingsOpen')) { openFocusSettings(); return; }
    if (event.target.closest('#enableFocusNotifications')) { requestFocusNotifications(); return; }
    if (event.target.closest('#exportData')) { exportData(); return; }
    if (event.target.closest('#importData')) { $('#importFile').click(); return; }
    if (event.target.closest('#clearData')) { clearAllData(); return; }
    if (event.target.matches('[data-modal-backdrop]')) closeModal();
  });

  document.addEventListener('change', event => {
    const target = event.target;
    if (target.matches('[data-action="toggle-task"]')) { toggleTask(target.dataset.id); return; }
    if (target.id === 'notesSubjectFilter') { notesSubjectFilter = target.value; renderNotes(); return; }
    if (target.id === 'notesCategoryFilter') { notesCategoryFilter = target.value; renderNotes(); return; }
    if (target.id === 'taskSubjectFilter') { taskSubjectFilter = target.value; renderTasks(); return; }
    if (target.id === 'importFile' && target.files?.[0]) { importData(target.files[0]); target.value = ''; }
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'noteSearch') {
      const position = event.target.selectionStart;
      notesQuery = event.target.value;
      renderNotes();
      const newInput = $('#noteSearch');
      newInput.focus(); newInput.setSelectionRange(position, position);
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'noteForm') { event.preventDefault(); saveNote(event.target); }
    if (event.target.id === 'taskForm') { event.preventDefault(); saveTask(event.target); }
    if (event.target.id === 'focusSettingsForm') { event.preventDefault(); saveFocusSettings(event.target); }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
    if (event.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
      event.preventDefault(); setPage('notes'); setTimeout(() => $('#noteSearch')?.focus(), 50);
    }
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFocusRemaining(); });
  window.addEventListener('pageshow', syncFocusRemaining);

  function boot() {
    initTheme(); renderSidebarSubjects();
    $('#todayLabel').textContent = formatLongDate(new Date());
    updateSidebarCounts(); setPage('home');
  }
  boot();
})();

  </script>
</body>
</html>
